
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cachee.ai - Coming Soon to Your Region</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container {
            text-align: center;
            max-width: 500px;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00D084, #667eea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
        }
        h1 {
            font-size: 1.75rem;
            margin-bottom: 1rem;
            color: #fff;
        }
        p {
            color: #a1a1aa;
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }
        .flag {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .notify-form {
            display: flex;
            gap: 0.5rem;
            max-width: 400px;
            margin: 0 auto;
        }
        input[type="email"] {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #333;
            border-radius: 8px;
            background: #1a1a1a;
            color: #fff;
            font-size: 1rem;
        }
        input[type="email"]:focus {
            outline: none;
            border-color: #00D084;
        }
        button {
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #00D084, #00a868);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 2rem;
            font-size: 0.875rem;
            color: #71717a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="flag">🌎</div>
        <div class="logo">Cachee.ai</div>
        <h1>Coming Soon to Your Region</h1>
        <p>
            We're currently available in the United States only as we scale our infrastructure.
            We're working hard to expand globally.
        </p>
        <p>Want to be notified when we launch in your area?</p>
        <form class="notify-form" action="https://app.cachee.ai/api/waitlist" method="POST">
            <input type="email" name="email" placeholder="Enter your email" required>
            <input type="hidden" name="country" value="JP">
            <button type="submit">Notify Me</button>
        </form>
        <div class="footer">
            <p>Questions? Contact us at <a href="mailto:hello@cachee.ai" style="color: #00D084;">hello@cachee.ai</a></p>
        </div>
    </div>
</body>
</html>
